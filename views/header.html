<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTittle}}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="container-fluid bg-dark sticky-top">
        <div class="row align-items-center">
            <div class="col-auto">
                <div class="dropdown mb-3">
                    <button class="btn button btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Tipo de vehículo</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/?tipo=Normal">Normal</a></li>
                        <li><a class="dropdown-item" href="/?tipo=XL">XL</a></li>
                        <li><a class="dropdown-item" href="/?tipo=Eco">Eco</a></li>
                        <li><a class="dropdown-item" href="/?tipo=Luxury">Luxury</a></li>
                    </ul>
                </div>
            </div>

            <div class="col text-center">
                <a href="/" class="text-decoration-none"><h1 class="m-0 text-warning fw-bold">CarMe</h1></a>
            </div>
            <div class="col-auto mb-2 mb-md-0">
                <form class="d-flex" role="search" action="/" method="GET">
                    <input class="form-control" type="search" name="search" placeholder="Buscar conductor..." aria-label="Buscar" value="{{search}}">
                    <button class="btn btn-outline-success ms-2" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </header>
