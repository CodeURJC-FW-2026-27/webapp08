    {{> header}}

    <div class="form-align">
        <div class="form-container mt-5 mb-5 card" >
            <h2>{{#driver}}Editar{{/driver}}{{^driver}}Nuevo{{/driver}} Conductor</h2>
            <form action="/newdriver" method="POST" enctype="multipart/form-data">

                <input type="hidden" name="driverId" value="{{driver._id}}">
                <input type="hidden" name="oldImage" value="{{driver.imageFileName}}">

                <label for="DriverName">Nombre:</label>
                <input type="text" id="DriverName" name="DriverName" value="{{driver.name}}" required minlength="3" maxlength="50" placeholder="Nombre del conductor">

                <label for="AutonomousComunity">Comunidad Autónoma:</label>
                <select id="AutonomousComunity" name="AutonomousComunity" required>
                    <option value="">Selecciona una comunidad...</option>
                    <option value="andalucia">Andalucía</option>
                    <option value="cataluna">Cataluña</option>
                    <option value="madrid">Comunidad de Madrid</option>
                    <option value="valencia">Comunidad Valenciana</option>
                    <option value="galicia">Galicia</option>
                    <option value="murcia">Murcia</option>
                    <option value="vasco">País Vasco</option>
                    <option value="navarra">Navarra</option>
                    <option value="extremadura">Extremadura</option>
                    <option value="canarias">Canarias</option>
                    <option value="baleares">Baleares</option>
                    <option value="ceuta">Ceuta</option>
                    <option value="melilla">Melilla</option>
                    <option value="asturias">Asturias</option>
                    <option value="cantabria">Cantabria</option>

                </select>
                

                <label for="vehicle">Vehículo:</label>
                <select id="Cartype" name="Cartype" required>
                <option value="">Selecciona el tipo de coche...</option>
                <option value="normal">Normal</option>
                <option value="xl">XL</option>
                <option value="eco">Eco</option>
                <option value="luxury">Luxury</option>
                </select>
                

                <label for="puntuation">Puntuación:</label>
                <input type="number" id="puntuation" name="puntuation" min="0" max="5" step="0.5" value="{{driver.puntuation}}" required placeholder="0">

                <label for="experience">Experiencia:</label>
                <input type="number" id="experience" name="experience" min="0" step="1" value="{{driver.experience}}" required placeholder="0">

                <label for="AvailableSpots">Plazas Disponibles:</label>
                <input type="number" id="AvailableSpots" name="AvailableSpots" min="1" max="4" step="1" value="{{driver.availabeSpots}}" required placeholder="1">

                <label for="image">Foto del conductor:</label>
                <input type="file" id="image" name="image" accept="image/*">

                <div class="checkbox-group">
                    <label for="Availability">¿Está disponible?</label>
                    <input type="checkbox" id="Availability" name="Availability" {{#driver.availability}}checked{{/driver.availability}}>
                </div>
                
                <button type="submit" class="btn button btn-dark">Guardar</button>
                <a href="/" class="btn button btn-outline-dark">Cancelar</a> 
            </form>
        </div>
    </div>

    {{> footer}}

</body>
</html>
