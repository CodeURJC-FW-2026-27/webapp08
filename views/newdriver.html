<!DOCTYPE html>
<html lang="es">
<head>    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>New driver - CarMe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../public/style.css">
</head>
<body>  
    <header class="container-fluid bg-dark sticky-top">
        <div class="row align-items-center">

            <div class="col-auto">
                <div class="dropdown mb-3">
                    <button class="btn button btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">Tipo de vehículo</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item">Normal</a></li>
                        <li><a class="dropdown-item">XL</a></li>
                        <li><a class="dropdown-item">Eco</a></li>
                        <li><a class="dropdown-item">Luxury</a></li>
                    </ul>
                </div>
            </div>

            <div class="col text-center">
                <a href="main.html" class="text-decoration-none"><h1 class="m-0 text-warning fw-bold">CarMe</h1></a>
            </div>
            <div class="col-auto mb-2 mb-md-0">
                <form class="d-flex" role="search">
                    <input class="form-control" type="search" placeholder="Buscar conductor..." aria-label="Buscar">
                </form>
            </div>
        </div>
    </header>

    <div class="form-align">
        <div class="form-container mt-5 mb-5 card" >
            <h2>Nuevo Conductor</h2>
            <form action="http://localhost:3000/newdriver" method="POST" enctype="multipart/form-data">
                <label for="DriverName">Nombre:</label>
                <input type="text" id="DriverName" name="DriverName" placeholder="Nombre del conductor">

                <label for="AutonomousComunity">Comunidad Autónoma:</label>
                <select id="AutonomousComunity" name="AutonomousComunity">
                    <option value="">Selecciona una comunidad...</option>
                    <option value="andalucia">Andalucía</option>
                    <option value="cataluna">Cataluña</option>
                    <option value="madrid">Comunidad de Madrid</option>
                    <option value="valencia">Comunidad Valenciana</option>
                    <option value="galicia">Galicia</option>
                    <option value="murcia">Murcia</option>
                    <option value="vasco">País Vasco</option>
                    <option value="navarra">Navarra</option>
                    <option value="extremadura">Extremadura</option>
                    <option value="canarias">Canarias</option>
                    <option value="baleares">Baleares</option>
                    <option value="ceuta">Ceuta</option>
                    <option value="melilla">Melilla</option>
                    <option value="asturias">Asturias</option>
                    <option value="cantabria">Cantabria</option>

                </select>
                

                <label for="vehicle">Vehículo:</label>
                <select id="Cartype" name="Cartype">
                <option value="">Selecciona el tipo de coche...</option>
                <option value="normal">Normal</option>
                <option value="xl">XL</option>
                <option value="eco">Eco</option>
                <option value="luxury">Luxury</option>
                </select>
                

                <label for="puntuation">Puntuación:</label>
                <input type="number" id="puntuation" name="puntuation" min="0" max="5" step="0.5" placeholder="0">
                <label for="experience">Experiencia:</label>
                <input type="number" id="experience" name="experience" min="0" step="1" placeholder="0">

                <label for="AvailableSpots">Plazas Disponibles:</label>
                <input type="number" id="AvailableSpots" name="AvailableSpots" min="1" max="4" step="1" placeholder="1">

                <label for="image">Foto del conductor:</label>
                <input type="file" id="image" name="image" accept="image/*">

                <div class="checkbox-group">
                    <label for="Availability">¿Está disponible?</label>
                    <input type="checkbox" id="Availability" name="Availability">
                </div>
                
                <button type="submit" class="btn button btn-dark">Guardar</button>
                <a href="main.html" class="btn button btn-outline-dark">Cancelar</a> 
            </form>
        </div>
    </div>

    <footer class="container-fluid bg-dark text-white py-5 mt-5">
        <div class="row text-center text-md-start">
                
            <div class="col-12 col-md-3 mb-4">
                <h3 class="fw-bold px-5">CarMe</h3>
                <p class="px-4">
                    <img src="../public/images/icono-facebook.png" class="me-3">
                    <img src="../public/images/icono-twitter.png" class="me-3">
                    <img src="../public/images/icono-instagram.png">
                </p>
            </div>

            <div class="col-12 col-md-3 mb-4">
                <h6 class="text-warning">LLÁMANOS GRATIS</h6>
                <p class="fs-5 fw-bold">+34 636 654 321</p>
            </div>

            <div class="col-12 col-md-3 mb-4">
                <h6 class="text-warning">CONSÚLTANOS</h6>
                <p><img src="../public/images/icono-whatsapp.png"> Iniciar chat</p>
            </div>

            <div class="col-12 col-md-3 mb-4">
                <h6 class="text-warning">ESCRÍBENOS</h6>
                <p>soporte@carme.com</p>
            </div>

        </div>
        <p class="text-center">© 2026 CarMe - Derechos reservados</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
