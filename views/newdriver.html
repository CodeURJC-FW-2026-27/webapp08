<!DOCTYPE html>
<html lang="es">
<head>    
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <link rel="stylesheet" href="../public/style.css">
    <title>CAR ME - Nuevo Conductor</title>
</head>
<body>  
    
    <div class="form-align">
        <div class="form-container">
            <h2>Nuevo Conductor</h2>
            <form>
                <label for="DriverName">Nombre:</label>
                <input type="text" id="DriverName" name="DriverName" placeholder="Nombre del conductor">

                <label for="AutonomousComunity">Comunidad Autónoma:</label>
                <select id="AutonomousComunity" name="AutonomousComunity">
                    <option value="">Selecciona una comunidad...</option>
                    <option value="andalucia">Andalucía</option>
                    <option value="cataluna">Cataluña</option>
                    <option value="madrid">Comunidad de Madrid</option>
                    <option value="valencia">Comunidad Valenciana</option>
                    <option value="galicia">Galicia</option>
                    <option value="murcia">Murcia</option>
                    <option value="vascongadas">Vascongadas</option>
                    <option value="navarra">Navarra</option>
                    <option value="extremadura">Estremadura</option>
                    <option value="canarias">Canarias</option>
                    <option value="baleares">Baleares</option>
                    <option value="ceuta">Ceuta</option>
                    <option value="melilla">Melilla</option>
                    <option value="asturias">Asturias</option>
                    <option value="cantabria">Cantabria</option>











                </select>

                <label for="vehicle">Vehículo:</label>
                <input type="text" id="vehicle" name="vehicle" placeholder="Ej: Toyota Prius">

                <label for="puntuation">Puntuación:</label>
                <input type="number" id="puntuation" name="puntuation" min="0" max="5" step="0.1" placeholder="0">

                <label for="AvailableSpots">Plazas Disponibles:</label>
                <input type="number" id="AvailableSpots" name="AvailableSpots" min="1" max="10" step="1" placeholder="1">

                <label for="image">Foto del conductor:</label>
                <input type="file" id="image" name="image" accept="image/*">

                <div class="checkbox-group">
                    <label for="Availability">¿Está disponible?</label>
                    <input type="checkbox" id="Availability" name="Availability">
                </div>
                
                <button type="submit" class="btn button btn-dark">Guardar</button>
                <a href="main.html" class="btn button btn-dark">Cancelar</a> 
            </form>
        </div>
    </div>

</body>
</html>
