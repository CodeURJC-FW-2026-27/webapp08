    {{> header}}

    <div class="form-align">
        <div class="form-container mt-5 mb-5 card" >
            <h2>{{#driver}}Editar{{/driver}}{{^driver}}Nuevo{{/driver}} Conductor</h2>
            <form action="/newdriver" method="POST" enctype="multipart/form-data">

                <input type="hidden" name="driverId" value="{{driver._id}}">
                <input type="hidden" name="oldImage" value="{{driver.imageFilename}}">

                <label for="DriverName">Nombre:</label>
                <input type="text" id="DriverName" name="DriverName" value="{{driver.name}}" required minlength="3" maxlength="50" placeholder="Nombre del conductor">

                <label for="AutonomousComunity">Comunidad Autónoma:</label>
                <select id="AutonomousComunity" name="AutonomousComunity" required>
                    <option value="">Selecciona una comunidad...</option>
                    <option value="andalucia" {{#selectedCommunity.Andalucia}}selected{{/selectedCommunity.Andalucia}}>Andalucía</option>
                    <option value="cataluna" {{#selectedCommunity.Cataluña}}selected{{/selectedCommunity.Cataluña}}>Cataluña</option>
                    <option value="madrid" {{#selectedCommunity.Madrid}}selected{{/selectedCommunity.Madrid}}>Comunidad de Madrid</option>
                    <option value="valencia" {{#selectedCommunity.Valencia}}selected{{/selectedCommunity.Valencia}}>Comunidad Valenciana</option>
                    <option value="galicia" {{#selectedCommunity.Galicia}}selected{{/selectedCommunity.Galicia}}>Galicia</option>
                    <option value="murcia" {{#selectedCommunity.Murcia}}selected{{/selectedCommunity.Murcia}}>Murcia</option>
                    <option value="vasco" {{#selectedCommunity.Vasco}}selected{{/selectedCommunity.Vasco}}>País Vasco</option>
                    <option value="navarra" {{#selectedCommunity.Navarra}}selected{{/selectedCommunity.Navarra}}>Navarra</option>
                    <option value="extremadura" {{#selectedCommunity.Extremadura}}selected{{/selectedCommunity.Extremadura}}>Extremadura</option>
                    <option value="canarias" {{#selectedCommunity.Canarias}}selected{{/selectedCommunity.Canarias}}>Canarias</option>
                    <option value="baleares" {{#selectedCommunity.Baleares}}selected{{/selectedCommunity.Baleares}}>Baleares</option>
                    <option value="ceuta" {{#selectedCommunity.Ceuta}}selected{{/selectedCommunity.Ceuta}}>Ceuta</option>
                    <option value="melilla" {{#selectedCommunity.Melilla}}selected{{/selectedCommunity.Melilla}}>Melilla</option>
                    <option value="asturias" {{#selectedCommunity.Asturias}}selected{{/selectedCommunity.Asturias}}>Asturias</option>
                    <option value="cantabria" {{#selectedCommunity.Cantabria}}selected{{/selectedCommunity.Cantabria}}>Cantabria</option>

                </select>
                

                <label for="vehicle">Vehículo:</label>
                <select id="Cartype" name="Cartype" required>
                <option value="">Selecciona el tipo de coche...</option>
                <option value="normal" {{#selectedVehicle.Normal}}selected{{/selectedVehicle.Normal}}>Normal</option>
                <option value="xl" {{#selectedVehicle.XL}}selected{{/selectedVehicle.XL}}>XL</option>
                <option value="eco" {{#selectedVehicle.Eco}}selected{{/selectedVehicle.Eco}}>Eco</option>
                <option value="luxury" {{#selectedVehicle.Luxury}}selected{{/selectedVehicle.Luxury}}>Luxury</option>
                </select>
                

                <label for="puntuation">Puntuación:</label>
                <input type="number" id="puntuation" name="puntuation" min="0" max="5" step="0.5" value="{{driver.puntuation}}" required placeholder="0">

                <label for="experience">Experiencia:</label>
                <input type="number" id="experience" name="experience" min="0" step="1" value="{{driver.experience}}" required placeholder="0">

                <label for="AvailableSpots">Plazas Disponibles:</label>
                <input type="number" id="AvailableSpots" name="AvailableSpots" min="1" max="4" step="1" value="{{driver.availableSpots}}" required placeholder="1">

                <label for="image">Foto del conductor:</label>
                <input type="file" id="image" name="image" accept="image/*">

                <div class="checkbox-group">
                    <label for="Availability">¿Está disponible?</label>
                    <input type="checkbox" id="Availability" name="Availability" {{#driver.availability}}checked{{/driver.availability}}>
                </div>
                
                <button type="submit" class="btn button btn-dark">Guardar</button>
                <a href="/" class="btn button btn-outline-dark">Cancelar</a> 
            </form>
        </div>
    </div>

    {{> footer}}

</body>
</html>
