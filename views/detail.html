<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Driver information - CarMe</title>
        <link rel="stylesheet" href="../public/style.css">
    </head>
    <body>
        <header>

        </header>
        <main>
            <section id="info-driver" class="card">
                <img src="{{ driver.image }}" alt="Driver image" style="width: 100%; max-width: 300px; border-radius: 5px; margin-bottom: 20px;">

                // Driver information
                <h2>Ana López</h2>
                <p><strong>ID:</strong> 12345</p>
                <p><strong>Community:</strong> Madrid</p>
                <p><strong>Vehicle:</strong> Toyota Prius</p>
                <p><strong>Rating:</strong> 4.5 / 5</p>
                <p><strong>Experience:</strong> 3 years</p>
                <p><strong>Availability:</strong> Yes</p>
                <p><strong>Seats available:</strong> 3</p>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
                    <button type="submit">Edit</button>
                    <button type="button">Delete</button>
                    <button type="button">Back to Main Page</button>
                </div>
            </section>
        </main>
        <footer>

        </footer>
    </body>
</html>
